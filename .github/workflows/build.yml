name: build

on:
  workflow_call:
    inputs:
      tag:
        description: OpenWrt 上游 tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'OpenWrt tag（如 v25.12.6），留空自动取最新稳定版'
        required: false
        default: ''

permissions:
  contents: write

# 同一个 tag 只允许一个编译在跑。push 会同时经 check-upstream 触发一次 build，
# 和手动 dispatch 并列跑会重复编译 70 分钟、还争抢同一个 Release tag。
# 用 cancel-in-progress: true，让后触发的（通常是有意重试）留下、旧的让路。
concurrency:
  group: openwrt-build-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: 'true'

jobs:
  build:
    name: build x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve upstream tag
        id: ver
        env:
          IN_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${IN_TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(curl -fsSL "https://api.github.com/repos/openwrt/openwrt/releases?per_page=100" \
              | jq -r '.[] | select(.draft==false and .prerelease==false) | .tag_name' \
              | grep -Ev 'rc|beta|alpha' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION=$tag" >> "$GITHUB_ENV"
          echo "VERFILE=${tag#v}" >> "$GITHUB_ENV"
          echo "上游版本: $tag"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo apt-get -qq clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            rsync unzip zstd lz4 file wget curl bc cpio ccache pkg-config swig jq

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: openwrt/.ccache
          key: ccache-x86-64-${{ steps.ver.outputs.version }}-${{ github.run_id }}
          restore-keys: |
            ccache-x86-64-${{ steps.ver.outputs.version }}-
            ccache-x86-64-

      - name: Clone feeds and prepare config
        run: |
          set -euo pipefail
          bash scripts/feeds.sh "$VERSION"
          mkdir -p openwrt/files
          cp -a files/common/. openwrt/files/
          # uci-defaults 必须可执行，否则首启不会执行（git 在 Windows 上会丢掉执行位）
          chmod -R 0755 openwrt/files/etc/uci-defaults
          bash scripts/prepare_config.sh config/x86_64.config config/ci-extra.config openwrt/.config
          ( cd openwrt && python3 ../scripts/trim_x86.py )
          ( cd openwrt && make defconfig )
          ( cd openwrt && bash ../scripts/verify_config.sh )
          # .config 只作为 Actions artifact 留存，不进 release/（Release 只放两个镜像）
          mkdir -p out-config
          cp openwrt/.config "out-config/config-${VERFILE}.config"

      - name: Upload generated .config
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dot-config-${{ steps.ver.outputs.version }}
          path: |
            openwrt/.config
            out-config/config-*.config
          if-no-files-found: ignore
          retention-days: 7

      - name: Download source packages
        run: cd openwrt && make -j"$(nproc)" download

      - name: Compile firmware
        # 必须开 pipefail：默认 bash -e 只看管道最后一个命令（tee）的退出码，
        # make 失败会被吞掉，步骤显示 success，然后在下一步「Collect images」才炸，
        # 日志里看不到真正的错误。第一次构建就是这样被误导的。
        run: |
          set -o pipefail
          cd openwrt && make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: openwrt/build.log
          if-no-files-found: ignore
          retention-days: 5

      - name: Collect images
        run: bash scripts/collect.sh "$VERFILE"

      - name: Verify plain firmware (lang / argon / openclash)
        run: bash scripts/verify_firmware.sh "$VERFILE" plain

      - name: Build preconfigured image
        run: bash scripts/make_preconfigured.sh "$VERFILE" files/preconfigured release

      - name: Checksums
        # 只把 sha256 打印进构建日志备查，不生成 sha256sums.txt 文件
        # （Release 里只保留两个 .img.gz，不要任何附带文件）
        run: |
          set -euo pipefail
          cd release
          for f in *.img.gz; do
            echo "== $(sha256sum "$f")"
          done
          ls -lh

      - name: Drop stale release for this tag
        # 同一个 tag 重跑时，旧 Release 里的历史附件（rootfs.tar.gz / kernel.bin /
        # config / sha256sums.txt）不会被 action-gh-release 自动清掉，会残留下来。
        # 这里先把该 tag 的 Release 删掉（保留 git tag），随后由下一步重建，
        # 保证 Release 里始终只有两个 .img.gz。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "发现已存在的 Release $VERSION，删除后重建（git tag 保留）"
            gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes
          else
            echo "该 tag 尚无 Release，直接创建"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: OpenWrt ${{ env.VERFILE }} x86_64 精简固件
          body: |
            ## 固件说明

            x86_64 精简固件（仅 Intel i225 / i226 网卡驱动 `igc`），默认 **简体中文 + Argon 主题**。

            组件：OpenWrt ${{ env.VERFILE }}、luci-theme-argon（含 argon-config）、luci-app-openclash（含 mihomo Meta 内核与 GeoIP/GeoSite/MMDB/ASN 四个数据库）、luci-app-upnp、bash/curl/wget/htop/vim/pciutils/usbutils。

            ## 两个镜像的区别

            | 文件 | 说明 |
            | --- | --- |
            | `...-ext4-combined-efi.img.gz` | 普通版，出厂默认配置 |
            | `...-ext4-combined-efi-preconfigured.img.gz` | 预配置版，额外带下述初始配置 |

            预配置版已写入：LAN `192.168.1.1/24`、DHCP 池 `.100-.199`、WAN 为 PPPoE 模板（账号密码留空）、4 条静态租约与 5 条端口转发（均指向 192.168.88.x）、UPnP 已开启（IGDv1 兼容，下行 1024 / 上行 512 kB/s）、时区 `Asia/Shanghai`。

            > 注意：静态租约与端口转发指向 `192.168.88.0/24`，需把 LAN 改成 `192.168.88.1/24` 后才生效；在 `192.168.1.0/24` 下这两组配置会被忽略。

            > SHA256 校验值打印在对应 Actions 运行的 `Checksums` 步骤日志里。

            ## 刷写

            1. 解压 `.img.gz` 得到 `.img`
            2. 用 Etcher / Rufus / dd 写入 U 盘或 SSD
            3. UEFI 引导启动（BIOS 引导的镜像未编译）
            4. 浏览器打开 `http://192.168.1.1`，首次登录必须设置 root 密码

            root 默认无密码，请勿直接暴露到公网。串口控制台为 `ttyS0`，115200。
          files: |
            release/*-ext4-combined-efi.img.gz
            release/*-ext4-combined-efi-preconfigured.img.gz
